<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosaic Bridge</title>
    <!-- Inline data-URI favicon: works offline, no extra request. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%236c5ce7'/%3E%3Ctext x='8' y='12' font-family='sans-serif' font-size='10' font-weight='700' text-anchor='middle' fill='%23fff'%3EM%3C/text%3E%3C/svg%3E">
    <!-- Vendored (not CDN): the UI must work — login included — when the
         gym's internet is down, which is exactly when staff reach for it. -->
    <script src="/ui/static/htmx-2.0.4.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f4f5f7; --sidebar: #fff; --sidebar-hover: #f4f5f7;
            --accent: #6c5ce7; --accent-light: #a29bfe;
            --text: #2d3436; --text-muted: #636e72;
            --card: #fff; --border: #dfe6e9;
            --success: #00b894; --danger: #d63031; --warning: #fdcb6e;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Sidebar — flex column so the logout link pins to the bottom. */
        .sidebar { width: 220px; background: var(--sidebar); color: var(--text); padding: 20px 0; flex-shrink: 0; position: fixed; top: 0; bottom: 0; overflow-y: auto; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar h1 { font-size: 18px; padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        .sidebar h1 span { color: var(--accent); }
        .nav-section { padding: 8px 20px 4px; font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .nav-link { display: block; padding: 10px 20px; color: var(--text); text-decoration: none; font-size: 14px; transition: all 0.15s; border-left: 3px solid transparent; }
        .nav-link:hover, .nav-link.active { background: var(--sidebar-hover); color: var(--accent); border-left-color: var(--accent); }

        /* Main content */
        .main { margin-left: 220px; padding: 24px; flex: 1; min-width: 0; }
        .page-header { margin-bottom: 24px; }
        .page-header h2 { font-size: 22px; font-weight: 600; }
        .page-header p { color: var(--text-muted); margin-top: 4px; }

        /* Cards. overflow-x lets wide tables scroll inside their card
           instead of forcing horizontal body scroll. */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; overflow-x: auto; }
        .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Stats grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: #f8f9fa; }

        /* Badges */
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-frozen { background: #cce5ff; color: #004085; }
        .badge-expired { background: #f8d7da; color: #721c24; }
        .badge-denied { background: #f8d7da; color: #721c24; }
        .badge-allowed { background: #d4edda; color: #155724; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-running { background: #cce5ff; color: #004085; }
        .badge-completed { background: #d4edda; color: #155724; }
        .badge-failed { background: #f8d7da; color: #721c24; }

        /* Forms */
        input, select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; width: 100%; }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,92,231,0.1); }
        .form-row { display: flex; gap: 12px; align-items: end; margin-bottom: 12px; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Buttons */
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-decoration: none; display: inline-block; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #5b4bd5; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #00a382; }
        /* Quiet destructive button: outline until hovered. A solid red
           button on every table row read as a wall of danger. */
        .btn-outline-danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
        .btn-outline-danger:hover { border-color: var(--danger); background: #fdf1f1; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        /* HTMX indicator */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Alerts */
        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-info { background: #fff; color: var(--text); border: 1px solid var(--border); border-left: 3px solid var(--accent); }

        /* Muted badge — neutral pill that stays high-contrast on white */
        .badge-muted { background: #fff; color: var(--text-muted); border: 1px solid var(--border); }

        /* Connection status */
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .status-dot.connected { background: var(--success); }
        .status-dot.disconnected { background: var(--danger); }

        /* Logout: quiet text link pinned to the sidebar bottom. */
        .logout-link { display: block; padding: 10px 20px; margin-top: auto; color: var(--text-muted); background: none; border: none; font-size: 13px; text-align: left; width: 100%; cursor: pointer; }
        .logout-link:hover { color: var(--danger); }

        /* No sub-768px rules: the old block collapsed the sidebar to a
           60px rail of zero-font-size nav links with no icons — literally
           invisible navigation, and iPad portrait is exactly 768px. The
           front desk uses a desktop; wide tables scroll in-card. */
    </style>
</head>
<body hx-headers='{"X-Requested-With":"XMLHttpRequest","X-CSRF-Token":"{{CSRF_TOKEN}}"}'>
    <nav class="sidebar">
        <h1><span>Mosaic</span> Bridge</h1>
        <!-- hx-get targets the SAME URL the browser shows (the shell
             route serves fragment-vs-full-page on HX-Request), so every
             pushed URL survives reload/bookmark/new-tab. -->
        <div class="nav-section">Dashboard</div>
        <a class="nav-link" href="/ui/" hx-get="/ui/" hx-target="#content" hx-push-url="true">Dashboard</a>
        <div class="nav-section">Members</div>
        <a class="nav-link" href="/ui/members" hx-get="/ui/members" hx-target="#content" hx-push-url="true">Members</a>
        <a class="nav-link" href="/ui/needs-match" hx-get="/ui/needs-match" hx-target="#content" hx-push-url="true">Needs Match</a>
        <a class="nav-link" href="/ui/checkins" hx-get="/ui/checkins" hx-target="#content" hx-push-url="true">Check-ins</a>
        <div class="nav-section">System</div>
        <a class="nav-link" href="/ui/sync" hx-get="/ui/sync" hx-target="#content" hx-push-url="true">Sync &amp; Jobs</a>
        <a class="nav-link" href="/ui/doors" hx-get="/ui/doors" hx-target="#content" hx-push-url="true">Door Policies</a>
        <a class="nav-link" href="/ui/metrics" hx-get="/ui/metrics" hx-target="#content" hx-push-url="true">Metrics</a>
        <button class="logout-link"
            hx-post="/ui/logout"
            hx-swap="none"
            hx-on::after-request="window.location='/ui/'">Log out</button>
    </nav>
    <main class="main">
        <div id="content">{{CONTENT}}</div>
    </main>
    <div id="toast" style="display:none; position:fixed; bottom:20px; right:20px; z-index:100; max-width:360px;"
         class="alert alert-error" role="alert"></div>
    <script>
    // Global HTMX failure handling. Without this, a fragment error left
    // stale data on screen with zero indication, and an expired session
    // made buttons silently do nothing.
    (function () {
        var toastTimer;
        function toast(msg) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { el.style.display = 'none'; }, 6000);
        }
        document.body.addEventListener('htmx:responseError', function (evt) {
            var status = evt.detail.xhr ? evt.detail.xhr.status : 0;
            if (status === 401 || status === 403) {
                // Session expired (401) or CSRF drift (403): reload the
                // current URL — the shell route serves login and the
                // post-login redirect returns here.
                window.location.reload();
                return;
            }
            toast('Server error (' + status + ') — the data on screen may be stale.');
        });
        document.body.addEventListener('htmx:sendError', function () {
            toast('Can’t reach the bridge — is the service running?');
        });
    })();

    // Active-nav highlight + per-page document.title. Server templates
    // are static strings (no per-page substitution pass), so the sidebar
    // link whose href matches location.pathname is the cheapest source
    // of truth — on initial load AND after every hx-push-url navigation.
    (function () {
        function syncNav() {
            var path = location.pathname.replace(/\/+$/, '') || '/ui';
            var links = document.querySelectorAll('.sidebar .nav-link');
            var title = 'Mosaic Bridge';
            links.forEach(function (a) {
                var href = a.getAttribute('href').replace(/\/+$/, '') || '/ui';
                var active = href === path;
                a.classList.toggle('active', active);
                if (active && href !== '/ui') {
                    title = a.textContent.trim() + ' — Mosaic Bridge';
                }
            });
            document.title = title;
        }
        syncNav();
        document.body.addEventListener('htmx:pushedIntoHistory', syncNav);
        window.addEventListener('popstate', syncNav);
    })();
    </script>
</body>
</html>
